services:
  web:
    build: ./docker/php
    # Solo desarrollo: en Windows los archivos montados aparecen como de root y
    # PHP (usuario www-data) no podría escribir en storage ni en bootstrap/cache.
    command: sh -c "chmod -R 777 storage bootstrap/cache && php-fpm"
    volumes:
      - ./web:/var/www/html
      - documentos:/var/www/html/storage/app/private
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./web:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

  procesador:
    build: ./procesador
    ports:
      - "${PROCESADOR_PORT:-8001}:8001"
    env_file:
      - path: ./procesador/.env
        required: false
    volumes:
      - ./procesador:/app
      - documentos:/data/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      retries: 5

  mysql:
    image: mysql:8.4
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sistema_re}
      MYSQL_USER: ${DB_USERNAME:-sistema_re}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-secret}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root-secret}"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

volumes:
  mysql-data:
  redis-data:
  # Documentos de los exámenes, compartidos entre Laravel y el procesador
  documentos:
